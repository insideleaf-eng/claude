<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ご招待状</title>
<style>
  :root {
    --paper: #fbf7f1;
    --ink: #3b3430;
    --muted: #8a7f78;
    --accent: #b88a6a;
    --accent-soft: #eadacb;
    --shadow: rgba(59, 52, 48, .18);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #221e1c;
      --ink: #f1ebe4;
      --muted: #b3a79e;
      --accent: #d6a886;
      --accent-soft: #3a322d;
      --shadow: rgba(0, 0, 0, .4);
    }
  }
  :root[data-theme="dark"] {
    --paper: #221e1c;
    --ink: #f1ebe4;
    --muted: #b3a79e;
    --accent: #d6a886;
    --accent-soft: #3a322d;
    --shadow: rgba(0, 0, 0, .4);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Yu Mincho", "Hiragino Mincho ProN", "Noto Serif JP", serif;
    overflow-x: hidden;
  }

  /* ---------- 開封演出（オープニング） ---------- */
  #opening {
    position: fixed; inset: 0; z-index: 10;
    display: grid; place-items: center;
    background: radial-gradient(ellipse at center, var(--accent-soft), var(--paper) 70%);
    transition: opacity .8s ease, visibility .8s;
  }
  #opening.done { opacity: 0; visibility: hidden; }
  .stage { position: relative; width: min(82vw, 340px); }
  .envelope {
    position: relative; width: 100%; aspect-ratio: 4 / 3;
    perspective: 900px;
    animation: rise 1.2s ease-out both;
  }
  .envelope .body {
    position: absolute; inset: 0; background: #fff; border-radius: 6px;
    box-shadow: 0 18px 40px var(--shadow);
  }
  .envelope .flap {
    position: absolute; left: 0; right: 0; top: 0; height: 55%;
    background: var(--accent);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top center;
    transition: transform 1s cubic-bezier(.6, 0, .2, 1);
    z-index: 2;
  }
  .envelope .card {
    position: absolute; left: 8%; right: 8%; top: 12%; bottom: 8%;
    background: var(--paper); border: 1px solid var(--accent-soft); border-radius: 4px;
    display: grid; place-items: center; text-align: center;
    transform: translateY(0);
    transition: transform 1.2s cubic-bezier(.2, .7, .2, 1) .5s;
    z-index: 1;
    padding: 12px;
    font-size: 14px; letter-spacing: .15em; color: var(--ink);
  }
  .envelope.open .flap { transform: rotateX(180deg); }
  .envelope.open .card { transform: translateY(-38%); }
  .open-btn {
    position: absolute; left: 50%; bottom: -64px; transform: translateX(-50%);
    background: none; border: 1px solid var(--accent); color: var(--accent);
    padding: 10px 26px; border-radius: 999px; font: inherit; letter-spacing: .2em;
    cursor: pointer; transition: opacity .4s;
  }
  .envelope.open + .open-btn { opacity: 0; pointer-events: none; }
  @keyframes rise { from { opacity: 0; transform: translateY(30px) scale(.96); } to { opacity: 1; transform: none; } }

  /* 花びら（装飾パーティクル） */
  .petal {
    position: fixed; top: -10vh; width: 12px; height: 16px; z-index: 9;
    background: var(--accent); opacity: .55; border-radius: 80% 0 80% 0;
    pointer-events: none;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translate3d(var(--dx), 110vh, 0) rotate(720deg); }
  }

  /* ---------- 本文 ---------- */
  main {
    max-width: 560px; margin: 0 auto; padding: 56px 16px 80px;
    opacity: 0; transform: translateY(16px);
    transition: opacity 1s ease .2s, transform 1s ease .2s;
  }
  main.show { opacity: 1; transform: none; }
  .frame {
    background: #fff; border-radius: 10px; padding: 36px 24px;
    box-shadow: 0 14px 36px var(--shadow); color: #3b3430;
  }
  :root[data-theme="dark"] .frame { background: #2c2724; color: var(--ink); }
  .kicker { text-align: center; font-size: 12px; letter-spacing: .4em; color: var(--accent); margin: 0 0 8px; }
  h1 { text-align: center; font-weight: 400; font-size: 28px; letter-spacing: .12em; margin: 0 0 6px; }
  .names { text-align: center; font-size: 18px; letter-spacing: .25em; margin: 0 0 24px; }
  .divider { display: flex; align-items: center; justify-content: center; gap: 12px; color: var(--accent); margin: 18px 0; }
  .divider::before, .divider::after { content: ""; height: 1px; width: 56px; background: var(--accent-soft); }
  p.message { line-height: 2; text-align: center; margin: 0 0 8px; }

  dl.details { display: grid; grid-template-columns: auto 1fr; gap: 14px 16px; margin: 24px 0 0; }
  dl.details dt { color: var(--muted); font-size: 13px; letter-spacing: .15em; padding-top: 2px; }
  dl.details dd { margin: 0; line-height: 1.7; }
  a.map { color: var(--accent); }

  .countdown { display: flex; justify-content: center; gap: 10px; margin: 28px 0 0; }
  .countdown div { min-width: 62px; padding: 10px 6px; border: 1px solid var(--accent-soft); border-radius: 8px; text-align: center; }
  .countdown b { display: block; font-size: 22px; font-weight: 400; }
  .countdown span { font-size: 11px; color: var(--muted); letter-spacing: .1em; }

  .rsvp { display: block; width: fit-content; margin: 28px auto 0; background: var(--accent); color: #fff;
    text-decoration: none; padding: 12px 32px; border-radius: 999px; letter-spacing: .2em; font-size: 14px; }

  /* 再生コントロール */
  .controls { position: fixed; right: 16px; bottom: 16px; z-index: 11; display: flex; gap: 8px; }
  .controls button {
    width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--accent);
    background: var(--paper); color: var(--accent); font-size: 16px; cursor: pointer;
  }
  .skip { position: fixed; left: 16px; top: 16px; z-index: 11; background: none; border: none; color: var(--muted); font: inherit; cursor: pointer; font-size: 13px; }
  [hidden] { display: none !important; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    main { opacity: 1; transform: none; }
  }
  @media (max-width: 360px) {
    h1 { font-size: 24px; }
    dl.details { grid-template-columns: 1fr; gap: 4px; }
    dl.details dd { margin-bottom: 12px; }
  }
</style>
</head>
<body>

<!-- 文言・日時などはここだけ編集すれば差し替えられます -->
<script>
  const INVITATION = {
    kicker: "WEDDING INVITATION",
    title: "ご案内",
    names: "Taro  &  Hanako",
    message: "日頃よりお世話になっております。\nささやかな集いを開きます。\nぜひご列席くださいますよう、ご案内申し上げます。",
    date: "2027年 5月 3日（月・祝）  13:00 開場",
    place: "〇〇ガーデンホテル 2F  ローズの間",
    address: "東京都〇〇区〇〇 1-2-3",
    mapUrl: "https://maps.google.com/?q=〇〇ガーデンホテル",
    rsvpLabel: "出欠のご返信",
    rsvpUrl: "mailto:example@example.com?subject=出欠のご返信",
    target: "2027-05-03T13:00:00+09:00",
    music: "" // 音源URLを入れると再生ボタンが有効になります（例: "music/theme.mp3"）
  };
</script>

<div id="opening" aria-label="オープニング">
  <div class="stage">
    <div class="envelope" id="envelope">
      <div class="body"></div>
      <div class="flap"></div>
      <div class="card">
        <div>
          <div>DEAR GUESTS</div>
          <div style="margin-top:8px;font-size:18px;" id="openingNames"></div>
        </div>
      </div>
    </div>
    <button class="open-btn" id="openBtn" type="button">OPEN</button>
  </div>
</div>

<button class="skip" id="skipBtn" type="button" hidden>スキップ</button>

<main id="main">
  <section class="frame">
    <p class="kicker" id="kicker"></p>
    <h1 id="title"></h1>
    <p class="names" id="names"></p>
    <div class="divider" aria-hidden="true">✿</div>
    <p class="message" id="message"></p>

    <dl class="details">
      <dt>日時</dt><dd id="date"></dd>
      <dt>会場</dt><dd id="place"></dd>
      <dt>住所</dt><dd><span id="address"></span><br><a class="map" id="map" target="_blank" rel="noopener">地図を開く</a></dd>
    </dl>

    <div class="countdown" id="countdown" aria-live="polite">
      <div><b id="cd-d">--</b><span>DAYS</span></div>
      <div><b id="cd-h">--</b><span>HOURS</span></div>
      <div><b id="cd-m">--</b><span>MIN</span></div>
    </div>

    <a class="rsvp" id="rsvp" target="_blank" rel="noopener"></a>
  </section>
</main>

<div class="controls">
  <button id="musicBtn" type="button" aria-label="音楽の再生/停止" hidden>♪</button>
</div>

<audio id="bgm" loop preload="none"></audio>

<script>
(() => {
  const $ = (id) => document.getElementById(id);

  // テキストを設定オブジェクトから流し込む（改行は <br> に変換）
  const setText = (id, text) => { $(id).textContent = text; };
  setText("kicker", INVITATION.kicker);
  setText("title", INVITATION.title);
  setText("names", INVITATION.names);
  setText("openingNames", INVITATION.names);
  $("message").innerHTML = INVITATION.message.replace(/\n/g, "<br>");
  setText("date", INVITATION.date);
  setText("place", INVITATION.place);
  setText("address", INVITATION.address);
  $("map").href = INVITATION.mapUrl;
  $("rsvp").href = INVITATION.rsvpUrl;
  setText("rsvp", INVITATION.rsvpLabel);

  // ---- 花びら演出 ----
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let petalTimer = null;
  const spawnPetal = () => {
    const p = document.createElement("div");
    p.className = "petal";
    p.style.left = Math.random() * 100 + "vw";
    p.style.setProperty("--dx", (Math.random() * 120 - 60) + "px");
    p.style.animationDuration = (4 + Math.random() * 4) + "s";
    document.body.appendChild(p);
    p.addEventListener("animationend", () => p.remove());
  };
  const startPetals = () => { if (!reduce) petalTimer = setInterval(spawnPetal, 380); };
  const stopPetals = () => clearInterval(petalTimer);

  // ---- 開封〜本文表示 ----
  let finished = false;
  const finish = () => {
    if (finished) return;
    finished = true;
    stopPetals();
    $("opening").classList.add("done");
    $("main").classList.add("show");
    $("skipBtn").hidden = true;
    if (INVITATION.music) $("musicBtn").hidden = false;
  };
  const openEnvelope = () => {
    $("envelope").classList.add("open");
    $("openBtn").style.display = "none";
    setTimeout(finish, reduce ? 0 : 2200);
  };

  $("openBtn").addEventListener("click", openEnvelope);
  $("skipBtn").addEventListener("click", finish);
  $("skipBtn").hidden = false;
  startPetals();
  if (reduce) $("openBtn").click();

  // ---- カウントダウン ----
  const target = new Date(INVITATION.target).getTime();
  const tick = () => {
    const diff = Math.max(0, target - Date.now());
    const d = Math.floor(diff / 86400000);
    const h = Math.floor(diff / 3600000) % 24;
    const m = Math.floor(diff / 60000) % 60;
    $("cd-d").textContent = d;
    $("cd-h").textContent = String(h).padStart(2, "0");
    $("cd-m").textContent = String(m).padStart(2, "0");
  };
  tick();
  setInterval(tick, 30000);

  // ---- 音楽（音源が設定されている場合のみ） ----
  if (INVITATION.music) {
    const bgm = $("bgm");
    bgm.src = INVITATION.music;
    const btn = $("musicBtn");
    btn.addEventListener("click", () => {
      if (bgm.paused) {
        bgm.play().then(() => btn.textContent = "❚❚").catch(() => {});
      } else {
        bgm.pause();
        btn.textContent = "♪";
      }
    });
  }
})();
</script>
</body>
</html>
